name: Launcher release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lua bridge and movement tests
        run: |
          python -m pip install lupa==2.8
          python -m unittest discover -s tests -p "test_*.py"
      - name: Package and validate
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag/version mismatch' }
          foreach ($path in @('Launcher.ps1','Update.ps1','Bridge.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_library.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Launcher library tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_update.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/test_ui.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Launcher UI tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_guard.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Replay native guard tests failed' }
          ./Build.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/TempestReplayLauncher.zip dist/TempestReplayLauncher.zip.sha256 --title "Tempest Replay Launcher $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
